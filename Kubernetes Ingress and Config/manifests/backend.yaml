---
# Backend: a tiny Python HTTP server that echoes back the config it was given,
# so the ConfigMap -> env and Secret -> env wiring is visible in the response body.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-backend
  namespace: default
  labels:
    app: campus-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: campus-backend
  template:
    metadata:
      labels:
        app: campus-backend
    spec:
      containers:
        - name: backend
          image: python:3.12-alpine
          command:
            - "sh"
            - "-c"
            - |
              python3 -c "
              import os
              from http.server import HTTPServer, BaseHTTPRequestHandler

              FIELDS = ['ENVIRONMENT', 'LOG_LEVEL', 'DEFAULT_CAMPUS',
                        'SESSION_TIMEOUT_MIN', 'POSTGRES_USER', 'POSTGRES_DB']

              class Handler(BaseHTTPRequestHandler):
                  def log_message(self, *args):
                      pass
                  def do_GET(self):
                      lines = ['Campus Backend API', '==================']
                      for f in FIELDS:
                          lines.append(f'{f:<20}: ' + os.getenv(f, 'unset'))
                      body = ('\n'.join(lines) + '\n').encode()
                      self.send_response(200)
                      self.send_header('Content-Type', 'text/plain')
                      self.send_header('Content-Length', str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)

              HTTPServer(('0.0.0.0', 5000), Handler).serve_forever()
              "
          ports:
            - containerPort: 5000
          # every key in the ConfigMap becomes an environment variable
          envFrom:
            - configMapRef:
                name: campus-app-config
          # named keys pulled out of the Secret, one at a time
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: campus-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: campus-db-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: campus-db-secret
                  key: POSTGRES_DB
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: campus-backend-service
  namespace: default
  labels:
    app: campus-backend
spec:
  type: ClusterIP
  selector:
    app: campus-backend
  ports:
    - name: http
      port: 80
      targetPort: 5000
      protocol: TCP
