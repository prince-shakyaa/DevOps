# Liveness: "is the process stuck?" Failing it makes the kubelet RESTART the container.
apiVersion: v1
kind: Pod
metadata:
  name: canteen-live
  labels: { app: canteen }
spec:
  containers:
    - name: web
      image: nginx:1.27-alpine
      ports: [{ containerPort: 80 }]
      livenessProbe:
        httpGet: { path: /, port: 80 }
        initialDelaySeconds: 3
        periodSeconds: 5
        failureThreshold: 3
