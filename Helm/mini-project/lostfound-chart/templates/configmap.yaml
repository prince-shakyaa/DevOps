apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lostfound.fullname" . }}
  labels:
    {{- include "lostfound.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.environment | quote }}
  CAMPUS: {{ .Values.app.campus | quote }}
  ITEMS: {{ .Values.app.items | join "|" | quote }}
  server.py: |
    import json, os, socket
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz":
                body = {"status": "ok"}
            else:
                body = {
                    "board": "lost-and-found",
                    "campus": os.environ["CAMPUS"],
                    "environment": os.environ["ENVIRONMENT"],
                    "items": os.environ["ITEMS"].split("|"),
                    "served_by": socket.gethostname(),
                }
            data = json.dumps(body).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.end_headers()
            self.wfile.write(data + b"\n")

        def log_message(self, *args):
            pass

    HTTPServer(("", int(os.environ.get("PORT", "8000"))), Handler).serve_forever()
