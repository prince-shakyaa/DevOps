# Fixed: the Service selector matches the Pod labels.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grades-api
spec:
  replicas: 2
  selector:
    matchLabels: { app: grades-api }
  template:
    metadata:
      labels: { app: grades-api }
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: grades-api
spec:
  selector: { app: grades-api }
  ports: [{ port: 80, targetPort: 80 }]
