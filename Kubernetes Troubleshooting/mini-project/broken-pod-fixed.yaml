# Fixed: a real tag, and the script supplied through a ConfigMap mounted at /app.
apiVersion: v1
kind: ConfigMap
metadata:
  name: admissions-script
data:
  process-admissions.sh: |
    echo "processing admission forms..."
    i=0; while true; do i=$((i+1)); echo "batch $i processed"; sleep 10; done
---
apiVersion: v1
kind: Pod
metadata:
  name: admissions-worker
spec:
  containers:
    - name: worker
      image: busybox:1.36
      command: ["sh", "/app/process-admissions.sh"]
      volumeMounts:
        - { name: script, mountPath: /app }
  volumes:
    - name: script
      configMap: { name: admissions-script }
