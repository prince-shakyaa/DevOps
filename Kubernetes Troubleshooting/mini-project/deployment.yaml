apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-portal
spec:
  replicas: 3
  selector:
    matchLabels: { app: campus-portal }
  template:
    metadata:
      labels: { app: campus-portal, tier: web }
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{ name: http, containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 64Mi }
