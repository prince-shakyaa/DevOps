# Exits 2 because its config file path is wrong.
apiVersion: v1
kind: Pod
metadata:
  name: canteen-billing
  labels: { gauntlet: "true" }
spec:
  containers:
    - name: billing
      image: busybox:1.36
      command: ["sh", "-c", "cat /etc/billing/rates.conf || { echo 'rates.conf missing, giving up'; exit 2; }"]
