apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: notice-web
  namespace: notice-board
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: notice-web }
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
