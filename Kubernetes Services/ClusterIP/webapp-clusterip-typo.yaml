# Deliberately broken: the selector says app=webap (typo), so it matches no Pod at all.
# Applied alongside the working Service to show what "no endpoints" looks like.
apiVersion: v1
kind: Service
metadata:
  name: webapp-typo
spec:
  type: ClusterIP
  selector:
    app: webap
  ports:
    - name: http
      port: 9090
      targetPort: http
