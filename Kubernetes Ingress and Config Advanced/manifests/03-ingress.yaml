# Path routing on hostel.local, host routing for api.hostel.local, and TLS for both.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hostel-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  tls:
    - hosts: [hostel.local, api.hostel.local]
      secretName: hostel-tls
  rules:
    - host: hostel.local
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service: { name: hostel-backend, port: { number: 8000 } }
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service: { name: hostel-frontend, port: { number: 80 } }
    - host: api.hostel.local
      http:
        paths:
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service: { name: hostel-backend, port: { number: 8000 } }
