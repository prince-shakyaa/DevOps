# Fixed: create the Secret the Pod depends on (normally from cert-manager or a vault).
apiVersion: v1
kind: Secret
metadata:
  name: fees-gateway-tls
type: Opaque
stringData:
  api-key: "fg-demo-0d41"
---
apiVersion: v1
kind: Pod
metadata:
  name: fees-gateway
spec:
  containers:
    - name: gateway
      image: nginx:1.27-alpine
      volumeMounts:
        - name: tls
          mountPath: /etc/fees-tls
          readOnly: true
  volumes:
    - name: tls
      secret:
        secretName: fees-gateway-tls
