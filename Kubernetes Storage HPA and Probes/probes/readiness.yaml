# Readiness: "should this Pod get traffic right now?" Failing it removes the Pod from
# Service endpoints but does NOT restart it. Ready means the file /tmp/ready exists,
# so readiness can be flipped from outside with kubectl exec.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canteen-menu
spec:
  replicas: 2
  selector:
    matchLabels: { app: canteen-menu }
  template:
    metadata:
      labels: { app: canteen-menu }
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          command: ["sh", "-c", "touch /tmp/ready && exec nginx -g 'daemon off;'"]
          ports: [{ containerPort: 80 }]
          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/ready"]
            periodSeconds: 3
            failureThreshold: 1
          livenessProbe:
            tcpSocket: { port: 80 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: canteen-menu
spec:
  selector: { app: canteen-menu }
  ports: [{ port: 80 }]
