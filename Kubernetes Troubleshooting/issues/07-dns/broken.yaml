# dnsPolicy None with a nameserver that does not exist -> the Pod cannot resolve
# anything, including in-cluster Service names.
apiVersion: v1
kind: Pod
metadata:
  name: notice-client
spec:
  dnsPolicy: None
  dnsConfig:
    nameservers: ["10.96.0.99"]
    searches: ["ts-issues.svc.cluster.local", "svc.cluster.local"]
  containers:
    - name: client
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
