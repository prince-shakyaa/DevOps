# Tiny Python API. Its source is shipped in a ConfigMap so no custom image is needed;
# its settings come from hostel-settings and its credentials from the Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hostel-backend-code
data:
  server.py: |
    import json, os, socket
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            body = json.dumps({
                "service": "hostel-backend",
                "pod": socket.gethostname(),
                "path": self.path,
                "mode": os.environ.get("APP_MODE"),
                "blocks": os.environ.get("HOSTEL_BLOCKS"),
                "db_user": os.environ.get("DB_USER"),
            }).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.end_headers()
            self.wfile.write(body + b"\n")

        def log_message(self, *args):
            pass

    HTTPServer(("", 8000), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hostel-backend
spec:
  replicas: 2
  selector:
    matchLabels: { app: hostel-backend }
  template:
    metadata:
      labels: { app: hostel-backend }
    spec:
      containers:
        - name: api
          image: python:3.12-alpine
          command: ["python", "/app/server.py"]
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: hostel-settings }
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: hostel-db-credentials, key: DB_USER }
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap: { name: hostel-backend-code }
---
apiVersion: v1
kind: Service
metadata:
  name: hostel-backend
spec:
  selector: { app: hostel-backend }
  ports: [{ port: 8000, targetPort: 8000 }]
