apiVersion: v1
kind: Pod
metadata:
  name: results-writer
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - { name: results, mountPath: /results }
  volumes:
    - name: results
      persistentVolumeClaim:
        claimName: results-pvc
