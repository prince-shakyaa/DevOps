# Dynamic provisioning: no PV written by hand. The default StorageClass
# (minikube's "standard", provisioner k8s.io/minikube-hostpath) creates one on demand.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: library-uploads
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 200Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: library-uploader
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo 'syllabus-2026.pdf' > /uploads/index.txt; sleep 3600"]
      volumeMounts:
        - { name: uploads, mountPath: /uploads }
  volumes:
    - name: uploads
      persistentVolumeClaim:
        claimName: library-uploads
