# A bare Pod. Nothing supervises it: delete it and it stays deleted.
apiVersion: v1
kind: Pod
metadata:
  name: campus-demo-pod
  labels:
    app: campus-demo
    tier: frontend
spec:
  containers:
    - name: nginx
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"
