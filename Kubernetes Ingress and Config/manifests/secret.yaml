kind: Secret
metadata:
  name: campus-db-secret
  namespace: default
  labels:
    app: campus-app
type: Opaque
data:
  # echo -n "campus_admin" | base64
  POSTGRES_USER: Y2FtcHVzX2FkbWlu
  # echo -n "n0t-a-real-password" | base64
  POSTGRES_PASSWORD: bjB0LWEtcmVhbC1wYXNzd29yZA==
  # echo -n "campus_records_db" | base64
  POSTGRES_DB: Y2FtcHVzX3JlY29yZHNfZGI=
