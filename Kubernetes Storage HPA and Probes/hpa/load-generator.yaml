# Three busybox Pods hammering the Service in a tight loop.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exam-rush
spec:
  replicas: 3
  selector:
    matchLabels: { app: exam-rush }
  template:
    metadata:
      labels: { app: exam-rush }
    spec:
      containers:
        - name: load
          image: busybox:1.36
          command: ["sh", "-c", "while true; do wget -q -O- http://result-calculator >/dev/null; done"]
