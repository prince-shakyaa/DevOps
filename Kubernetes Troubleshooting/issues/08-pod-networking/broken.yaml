# The server binds to 127.0.0.1, so it only accepts connections from inside its own Pod.
# Other Pods (and the Service) get "connection refused" even though the Pod is Running.
apiVersion: v1
kind: Pod
metadata:
  name: attendance-api
  labels: { app: attendance-api }
spec:
  containers:
    - name: api
      image: python:3.12-alpine
      command: ["python", "-m", "http.server", "8080", "--bind", "127.0.0.1"]
      ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: attendance-api
spec:
  selector: { app: attendance-api }
  ports: [{ port: 80, targetPort: 8080 }]
