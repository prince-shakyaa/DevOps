server {
    listen 80;
    root /usr/share/nginx/html;

    # React app: unknown paths fall back to index.html
    location / {
        try_files $uri /index.html;
    }

    # API calls go to the backend container, resolved by name on the Docker network
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
