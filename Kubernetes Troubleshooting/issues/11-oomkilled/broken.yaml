# Loads ~200 MiB of "marks data" into memory with a 64 MiB limit -> the kernel
# OOM killer ends it (exit code 137) -> OOMKilled, then CrashLoopBackOff.
apiVersion: v1
kind: Pod
metadata:
  name: marks-cruncher
spec:
  containers:
    - name: cruncher
      image: python:3.12-alpine
      command: ["python", "-c", "import time; data = bytearray(200 * 1024 * 1024); print('loaded', len(data) >> 20, 'MiB', flush=True); time.sleep(3600)"]
      resources:
        requests: { memory: 64Mi }
        limits:   { memory: 64Mi }
