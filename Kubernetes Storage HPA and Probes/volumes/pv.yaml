# Static provisioning: an admin creates the PV by hand.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: results-pv
  labels: { tier: results }
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /data/results-pv
