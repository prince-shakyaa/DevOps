# Requests far more CPU than the single node has (15 cores) -> unschedulable.
apiVersion: v1
kind: Pod
metadata:
  name: timetable-solver
spec:
  containers:
    - name: solver
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: "40"
          memory: 64Mi
