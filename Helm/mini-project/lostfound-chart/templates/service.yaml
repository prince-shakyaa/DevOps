apiVersion: v1
kind: Service
metadata:
  name: {{ include "lostfound.fullname" . }}
  labels:
    {{- include "lostfound.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "lostfound.selector" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
