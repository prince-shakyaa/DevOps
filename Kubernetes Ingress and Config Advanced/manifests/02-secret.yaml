# Secret written two ways: `data` holds base64 that we encoded ourselves,
# `stringData` takes plain text and the API server encodes it on write.
apiVersion: v1
kind: Secret
metadata:
  name: hostel-db-credentials
type: Opaque
data:
  DB_USER: d2FyZGVu              # echo -n 'warden' | base64
  DB_PASSWORD: SDBzdGVsI0Rlc2syMDI2   # echo -n 'H0stel#Desk2026' | base64
stringData:
  DB_HOST: "hostel-db.default.svc.cluster.local"
