# The same Secret consumed as env vars and as files (tmpfs, mode 0400).
apiVersion: v1
kind: Pod
metadata:
  name: secret-reader
spec:
  containers:
    - name: reader
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: hostel-db-credentials
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hostel-db-credentials
              key: DB_PASSWORD
      volumeMounts:
        - name: creds
          mountPath: /run/secrets/db
          readOnly: true
  volumes:
    - name: creds
      secret:
        secretName: hostel-db-credentials
        defaultMode: 0400
