# The app refuses to start without EXAM_DB_URL and exits 1 -> kubelet restarts it with
# growing back-off (10s, 20s, 40s ... 5m) -> CrashLoopBackOff.
apiVersion: v1
kind: Pod
metadata:
  name: exam-sync
spec:
  containers:
    - name: sync
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          echo "exam-sync starting"
          if [ -z "$EXAM_DB_URL" ]; then echo "FATAL: EXAM_DB_URL is not set" >&2; exit 1; fi
          echo "connected to $EXAM_DB_URL"; sleep 3600
