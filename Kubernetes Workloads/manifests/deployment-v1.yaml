# Revision 1. maxUnavailable: 0 means a new Pod must be Ready before an old one goes away.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-backend
  labels:
    app: campus-backend
    version: "1.0.0"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: campus-backend
  template:
    metadata:
      labels:
        app: campus-backend
        version: "1.0.0"
    spec:
      containers:
        - name: backend
          image: python:3.12-alpine
          command: ["sh", "-c", "echo 'Backend v1.0.0 on :5000'; python3 -m http.server 5000"]
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
