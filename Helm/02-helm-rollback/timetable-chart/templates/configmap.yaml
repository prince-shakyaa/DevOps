apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "timetable.fullname" . }}-page
  labels:
    {{- include "timetable.labels" . | nindent 4 }}
data:
  index.html: |
    <!doctype html>
    <html><head><title>Timetable {{ .Values.page.release }}</title></head>
    <body style="font-family:sans-serif;margin:40px">
    <h1 style="color:{{ .Values.page.colour }}">{{ .Values.page.banner }}</h1>
    <p>Release {{ .Values.page.release }} &middot; Helm revision {{ .Release.Revision }}</p>
    </body></html>
