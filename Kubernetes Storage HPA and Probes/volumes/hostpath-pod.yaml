# hostPath mounts a directory of the NODE into the Pod.
apiVersion: v1
kind: Pod
metadata:
  name: hostpath-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo \"exam schedule saved by $(hostname) at $(date +%T)\" > /node-data/schedule.txt; sleep 3600"]
      volumeMounts:
        - { name: node-dir, mountPath: /node-data }
  volumes:
    - name: node-dir
      hostPath:
        path: /data/exam-cell
        type: DirectoryOrCreate
