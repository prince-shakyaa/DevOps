# Same slow starter with a 3 x 5s = 15s budget: killed before it ever finishes starting.
apiVersion: v1
kind: Pod
metadata:
  name: marksheet-short
spec:
  terminationGracePeriodSeconds: 2   # sh as PID 1 ignores SIGTERM; don't wait the default 30s
  containers:
    - name: engine
      image: busybox:1.36
      command: ["sh", "-c", "echo warming up; sleep 30; touch /tmp/started; echo started; sleep 3600"]
      startupProbe:
        exec: { command: ["test", "-f", "/tmp/started"] }
        periodSeconds: 5
        failureThreshold: 3
      livenessProbe:
        exec: { command: ["test", "-f", "/tmp/started"] }
        periodSeconds: 10
