# Fixed: the Service the cron needs exists and the name is spelt correctly.
apiVersion: v1
kind: Service
metadata:
  name: placement-api
spec:
  selector: { app: placement-api }
  ports: [{ port: 80 }]
---
apiVersion: v1
kind: Pod
metadata:
  name: placement-cron
  labels: { gauntlet: "true" }
spec:
  containers:
    - name: cron
      image: busybox:1.36
      command: ["sh", "-c", "while true; do nslookup placement-api 2>/dev/null | grep -q Name: && echo ok || echo \"$(date +%T) cannot resolve placement-api\"; sleep 5; done"]
