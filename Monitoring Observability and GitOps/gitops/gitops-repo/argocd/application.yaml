# Argo CD watches app/ in the Git repo and keeps the campus-portal namespace equal to it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: campus-portal
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://git-server.gitops-git.svc.cluster.local/campus-gitops.git
    targetRevision: main
    path: app
  destination:
    server: https://kubernetes.default.svc
    namespace: campus-portal
  syncPolicy:
    automated:
      prune: true      # resources deleted from Git are deleted from the cluster
      selfHeal: true   # manual changes in the cluster are reverted to what Git says
