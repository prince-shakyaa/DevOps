# Keep average CPU at ~50% of the request (100m per Pod), between 1 and 6 replicas.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: result-calculator
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: result-calculator
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60     # default is 300s; shortened so the lab doesn't take 5 min
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
